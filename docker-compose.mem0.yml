name: forgeloop-ai

# Standalone add-on, separate compose file on purpose (same reasoning as
# docker-compose.chatterbox.yml): rebuilding/recreating the portal must not
# touch this, and vice versa.
#
# Local replacement for Yulify's Understory memory add-on - see
# mem0-server/server.py's docstring for why.
services:
  mem0:
    build:
      context: ./mem0-server
      labels:
        forgeloop.managed: "true"
        forgeloop.project: "forgeloop-ai"
        forgeloop.resource: "mem0-image"
    image: forgeloop-ai-yulify-mem0:latest
    labels:
      forgeloop.managed: "true"
      forgeloop.project: forgeloop-ai
      forgeloop.resource: mem0
    container_name: forgeloop-ai-yulify-mem0
    restart: unless-stopped
    network_mode: host
    volumes:
      - mem0-data:/data
    environment:
      PORT: "3900"
      # "tamamen localde olsun" - mem0 phones home usage telemetry (PostHog)
      # by default; this is the only thing that would leave the machine.
      MEM0_TELEMETRY: "False"
      MEM0_BEARER_TOKEN: ${MEM0_BEARER_TOKEN:?set this in .env}
      MEM0_EMBEDDER_BASE_URL: http://127.0.0.1:8089/v1
      # Fact extraction uses its own scoped token through the local provider.
      MEM0_LLM_BASE_URL: http://127.0.0.1:10115/v1
      MEM0_LLM_MODEL: minicpm-mem0
      MEM0_LLM_API_KEY: ${MEM0_PROVIDER_API_KEY:?mint a provider token with llm scope}

volumes:
  mem0-data:
    name: forgeloop-ai-yulify-mem0-data
    labels:
      forgeloop.managed: "true"
      forgeloop.project: forgeloop-ai
      forgeloop.resource: volume
