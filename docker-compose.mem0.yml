# Standalone add-on, separate compose file on purpose (same reasoning as
# docker-compose.chatterbox.yml): rebuilding/recreating the portal must not
# touch this, and vice versa.
#
# Local replacement for Pithagoras's Understory memory add-on - see
# mem0-server/server.py's docstring for why.
services:
  mem0:
    build: ./mem0-server
    image: pithagoras-mem0:latest
    container_name: pithagoras-mem0
    restart: unless-stopped
    network_mode: host
    volumes:
      - mem0-data:/data
    environment:
      PORT: "3900"
      # "tamamen localde olsun" - mem0 phones home usage telemetry (PostHog)
      # by default; this is the only thing that would leave the machine.
      MEM0_TELEMETRY: "False"
      MEM0_BEARER_TOKEN: ${MEM0_BEARER_TOKEN:?set this in .env}
      MEM0_EMBEDDER_BASE_URL: http://127.0.0.1:8089/v1
      # 2026-10-20: the LLM went from the old strata-swift (127.0.0.1:10084, swift-1.5-iq3_xxs) to LiteLLM's
      # minicpm-mem0 alias - that port died with the 2026-10-17 PolyStrata migration and every memory_add
      # failed with "LLM extraction failed: Connection error". The alias forces thinking off (mem0 reads
      # message.content, null on MiniCPM when thinking is on) and rides GPU 1's resident model - no swap.
      MEM0_LLM_BASE_URL: http://127.0.0.1:10080/v1
      MEM0_LLM_MODEL: minicpm-mem0
      MEM0_LLM_API_KEY: ${LITELLM_MASTER_KEY:?set this in .env}

volumes:
  mem0-data:
